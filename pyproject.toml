[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cats-dogs-cnn-from-scratch"
version = "0.1.0"
description = "Учебная CNN для классификации фотографий кошек и собак, обучаемая с нуля"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26,<3", "Pillow>=10,<13", "tensorflow>=2.16,<3"]

[project.optional-dependencies]
training = ["pandas>=2,<3", "matplotlib>=3.8,<4", "scikit-learn>=1.4,<2", "jupyterlab>=4,<5"]
download = ["gdown>=5,<6"]

[project.scripts]
cats-dogs-predict = "cats_dogs_cnn.predict:main"

[tool.setuptools.packages.find]
where = ["src"]
