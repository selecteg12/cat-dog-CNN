name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e . pandas
      - run: python -m unittest discover -s tests -v
        env:
          TF_CPP_MIN_LOG_LEVEL: '2'
